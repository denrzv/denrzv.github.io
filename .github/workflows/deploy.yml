name: Publish Bloom Flowers

# Serves denrzv/bloom-flowers at this origin ROOT.
#
# Why this repository exists as a deployment target rather than as a copy of the site: SiteSkin
# discovery requests `/.well-known/siteskin.json` at the origin root, and the reference manifest's
# paths (`/catalog`, `/cart`, `/account`, `/assets/siteskin/logo.png`) are origin-absolute. A
# GitHub Pages *project* site is served from a subpath, where that well-known path belongs to
# whoever owns the user-site root and every manifest path resolves outside the deployment. A user
# site owns its root, so the integration is reachable here and nowhere else on github.io.
#
# This is a verification stopgap, not the permanent home. A dedicated Bloom/Webora domain is the
# intended destination once DNS is intentionally configured.
#
# Nothing is copied into this repository. The workflow checks out denrzv/bloom-flowers at deploy
# time, so Bloom remains the single source of truth. The published artifact also records the exact
# Bloom commit in /deployment.json so source/live drift is observable rather than inferred from UI.

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Cross-repository pushes cannot trigger this workflow without an additional token/app. Keep
    # the demo bounded to at most a few hours stale, and use workflow_dispatch immediately after a
    # visual/demo merge when freshness matters.
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the reference integration
        uses: actions/checkout@v4
        with:
          repository: denrzv/bloom-flowers
          ref: main
          path: site

      - name: Record Bloom source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          bloom_sha="$(git -C site rev-parse HEAD)"
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{\n  "sourceRepository": "denrzv/bloom-flowers",\n  "sourceRef": "main",\n  "sourceSha": "%s",\n  "generatedAt": "%s"\n}\n' \
            "$bloom_sha" "$generated_at" > site/deployment.json
          echo "bloom_sha=$bloom_sha" >> "$GITHUB_OUTPUT"

      - name: Every linked local route and asset is served
        working-directory: site
        run: python3 tools/check-routes.py

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Bloom Flowers deployment"
            echo
            echo "- Bloom source: \`${{ steps.source.outputs.bloom_sha }}\`"
            echo "- Live origin: https://denrzv.github.io/"
            echo "- Source metadata: https://denrzv.github.io/deployment.json"
          } >> "$GITHUB_STEP_SUMMARY"
